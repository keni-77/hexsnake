<!DOCTYPE html><html lang="ja"><head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>HEXSNAKE</title>
  <link rel="icon" href="https://keni-77.github.io/icon.ico">
  <style>
  body {
    background-color: #0a0a12;
    background-image: 
      linear-gradient(rgba(18, 18, 32, 0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(18, 18, 32, 0.5) 1px, transparent 1px);
    background-size: 20px 20px;
    color: #e2e8f0;
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
    margin: 0;
    padding: 0;
    width: 100vw;
    height: 100vh;
    box-sizing: border-box;
    overflow: hidden; /* スクロールを完全に禁止 */
  }

  /* スコアを画面左上に浮かせる */
  .top-ui-container {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 100;
  }

  #score-container {
    font-size: 1.2rem;
    font-weight: bold;
    color: #00ff87;
    background: rgba(0, 255, 135, 0.1);
    border: 1px solid rgba(0, 255, 135, 0.3);
    padding: 8px 24px;
    border-radius: 25px;
    box-shadow: 0 0 20px rgba(0, 255, 135, 0.15);
    letter-spacing: 1px;
    backdrop-filter: blur(4px);
  }
  
  #score-container span {
    color: #ffffff;
    font-family: monospace;
    margin-left: 8px;
    font-size: 1.3rem;
  }

  /* キャンバスを画面の中央に配置 */
  .canvas-wrapper {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    border: 2px solid rgba(95, 117, 148, 0.3);
    border-radius: 12px;
    padding: 4px;
    background: rgba(15, 15, 25, 0.8);
    box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    box-sizing: border-box;
  }

  canvas {
    background: #0f0f16;
    display: block;
    border-radius: 8px;
    outline: none;
    touch-action: none;
  }
  </style></head><body>

  <!-- UIはスコアのみに -->
  <div class="top-ui-container">
    <div id="score-container">
      SCORE:<span id="score">0</span>
    </div>
  </div>

  <div class="canvas-wrapper">
    <canvas id="canvas"></canvas>
  </div>

  <script src="https://cdn.discordapp.com/embedded-apps/sdk/embedded.js"></script>
  <script>
  if (window.DiscordSDK) {
    DiscordSDK.ready.then(async () => {
      const { user } = await DiscordSDK.commands.getUser();
      console.log("Discord user:", user.username);
    });
  } else {
    // -------------------------
    // Config
    // -------------------------
    const BOARD_RADIUS = 6;
    const ROT_DEG = 30;
    const STEP_MS_DEFAULT = 180;
    const MIN_HEX_SIZE = 6;

    // -------------------------
    // Globals
    // -------------------------
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const score_span = document.getElementById("score");

    let HEX_SIZE = 24;
    let CENTER_X = 0;
    let CENTER_Y = 0;

    const ROT_RAD = -ROT_DEG * Math.PI / 180;
    const COS_A = Math.cos(ROT_RAD);
    const SIN_A = Math.sin(ROT_RAD);

    let snake = [];
    let prev_snake = []; 
    let visual_snake = [];
    let last_step_time = 0; 

    let current_dir = [0, -1];
    let honey = null; 
    let running = false;
    let game_over = false;
    let interval_id = null;
    let STEP_MS = STEP_MS_DEFAULT;
    let score = 0;

    let crashing = false;
    let crash_effect_triggered = false;
    let crash_particles = [];
    let crash_time = 0;
    
    let in_fatal_grace = false;
    let pre_fatal_snake = [];

    const NEIGHBORS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
    let DIR_MAPPING = {}; 

    let overlay_text = null;
    let overlay_big = false;

    // -------------------------
    // Geometry / helpers
    // -------------------------
    function eq(a, b) {
      if (!a || !b) return false;
      return a[0] === b[0] && a[1] === b[1];
    }

    function inSnake(cell) {
      return snake.some(s => eq(s, cell));
    }

    function rotate_point(x, y) {
      const tx = x - CENTER_X;
      const ty = y - CENTER_Y;
      const rx = tx * COS_A - ty * SIN_A;
      const ry = tx * SIN_A + ty * COS_A;
      return [rx + CENTER_X, ry + CENTER_Y];
    }

    function axial_to_pixel_raw(q, r) {
      const x = HEX_SIZE * (Math.sqrt(3) * q + (Math.sqrt(3)/2) * r);
      const y = HEX_SIZE * (3/2 * r);
      return [x + CENTER_X, y + CENTER_Y];
    }

    function axial_to_pixel(q, r) {
      const [x, y] = axial_to_pixel_raw(q, r);
      return rotate_point(x, y);
    }

    function in_board(cell) {
      const [q, r] = cell;
      return Math.abs(q) <= BOARD_RADIUS && Math.abs(r) <= BOARD_RADIUS && Math.abs(q + r) <= BOARD_RADIUS;
    }

    function resize_canvas() {
      // 画面の幅と高さのうち、短い方を基準にする (余白を少し取る)
      const margin = 40; 
      let size = Math.min(window.innerWidth, window.innerHeight) - margin;
      if (size < 250) size = 250;

      // キャンバスを正方形にする
      canvas.width = size;
      canvas.height = size;
      CENTER_X = canvas.width / 2;
      CENTER_Y = canvas.height / 2;
      
      // 盤面がキャンバス内に完全に収まるようにHEX_SIZEを逆算
      const board_radius_units = Math.sqrt(3) * BOARD_RADIUS + 1; // 盤面の半径（ヘクス単位）
      const hex_margin = 15; // 盤面とキャンバス枠の間の余白
      
      HEX_SIZE = (size - hex_margin * 2) / (board_radius_units * 2);
      
      if (HEX_SIZE < MIN_HEX_SIZE) HEX_SIZE = MIN_HEX_SIZE;
    }

    // -------------------------
    // Drawing
    // -------------------------
    function draw_hex_vertices_raw(q, r) {
      const [cx_raw, cy_raw] = axial_to_pixel_raw(q, r);
      let verts = [];
      for (let i = 0; i < 6; i++) {
        const angle = (60 * i - 30) * Math.PI / 180;
        const px = cx_raw + HEX_SIZE * Math.cos(angle);
        const py = cy_raw + HEX_SIZE * Math.sin(angle);
        verts.push(rotate_point(px, py));
      }
      return verts;
    }

    function draw_hex_at(q, r, fill_color, stroke_color="#222", stroke=true) {
      const verts = draw_hex_vertices_raw(q, r);
      ctx.beginPath();
      verts.forEach((v, i) => {
        if (i === 0) ctx.moveTo(v[0], v[1]);
        else ctx.lineTo(v[0], v[1]);
      });
      ctx.closePath();
      ctx.fillStyle = fill_color;
      ctx.fill();
      if (stroke) {
        ctx.strokeStyle = stroke_color;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      }
    }

    function draw_board() {
      for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
        for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
          if (Math.abs(q + r) <= BOARD_RADIUS) {
            draw_hex_at(q, r, "#12121a", "#2a2a38");
          }
        }
      }
    }

    // -------------------------
    // Honey & Effects
    // -------------------------
    let honey_hex_effect = null;

    function trigger_honey_spawn_effect(cx, cy) {
      honey_hex_effect = { cx: cx, cy: cy, scale: 1.0, alpha: 1.0 };
    }

    function spawn_one_random_honey_not_on_snake() {
      let free = [];
      for (let q = -BOARD_RADIUS; q <= BOARD_RADIUS; q++) {
        for (let r = -BOARD_RADIUS; r <= BOARD_RADIUS; r++) {
          const cell = [q, r];
          if (in_board(cell) && !inSnake(cell)) {
            free.push(cell);
          }
        }
      }
      if (free.length === 0) {
        honey = null;
        return null;
      }
      honey = free[Math.floor(Math.random() * free.length)];
      
      const [cx, cy] = axial_to_pixel(honey[0], honey[1]);
      trigger_honey_spawn_effect(cx, cy);

      return honey;
    }

    function draw_honey(timestamp) {
        if (honey === null) return;
        const [q, r] = honey;
        const [cx, cy] = axial_to_pixel(q, r);
        const verts = draw_hex_vertices_raw(q, r);

        const pulse = 0.85 + 0.15 * Math.sin(timestamp / 200);

        ctx.save();
        ctx.shadowBlur = HEX_SIZE * 0.5;
        ctx.shadowColor = "#ff9400";

        ctx.beginPath();
        verts.forEach((v, idx) => {
            const sx = cx + (v[0] - cx) * pulse;
            const sy = cy + (v[1] - cy) * pulse;
            if (idx === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        });
        ctx.closePath();
        ctx.fillStyle = "#ff7700"; 
        ctx.fill();
        ctx.strokeStyle = "#ffaa00"; 
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.shadowBlur = 0;
        const inner_pulse = 0.4 + 0.1 * Math.sin(timestamp / 200 + 1);
        ctx.beginPath();
        verts.forEach((v, idx) => {
            const sx = cx + (v[0] - cx) * inner_pulse;
            const sy = cy + (v[1] - cy) * inner_pulse;
            if (idx === 0) ctx.moveTo(sx, sy);
            else ctx.lineTo(sx, sy);
        });
        ctx.closePath();
        ctx.fillStyle = "#ffdd33";
        ctx.fill();

        ctx.restore();
    }

    // -------------------------
    // Snake
    // -------------------------
    function place_initial_snake() {
      const up_dir = DIR_MAPPING["w"];
      current_dir = up_dir;
      
      const head = [0, 0]; 
      const mid = [0 - up_dir[0], 0 - up_dir[1]];
      const tail = [0 - 2 * up_dir[0], 0 - 2 * up_dir[1]];
      
      snake = [head, mid, tail];
      prev_snake = snake.map(cell => [...cell]); 
      last_step_time = performance.now();

      visual_snake = snake.map(cell => {
        const [px, py] = axial_to_pixel(cell[0], cell[1]);
        return { x: px, y: py };
      });
    }

    function draw_snake() {
      const len = visual_snake.length;
      if (len === 0) return;

      ctx.save();
      ctx.lineCap = "round";
      ctx.lineJoin = "round";

      for (let i = len - 1; i >= 0; i--) {
        const avg_ratio = (len - i) / len;

        ctx.lineWidth = HEX_SIZE * (0.5 + avg_ratio * 0.6);
        const rColor = Math.floor(20 + 38 * avg_ratio);
        const gColor = Math.floor(100 + 155 * avg_ratio);
        const bColor = Math.floor(60 + 46 * avg_ratio);
        
        ctx.strokeStyle = `rgb(${rColor}, ${gColor}, ${bColor})`;
        ctx.shadowColor = `rgba(0, 255, 135, ${avg_ratio * 0.6})`;
        ctx.shadowBlur = HEX_SIZE * 0.5;

        ctx.beginPath();
        if (i === len - 1) {
            if (len > 1) {
                const p_curr = visual_snake[i];
                const p_prev = visual_snake[i-1];
                const mid = { x: (p_curr.x + p_prev.x)/2, y: (p_curr.y + p_prev.y)/2 };
                ctx.moveTo(p_curr.x, p_curr.y);
                ctx.lineTo(mid.x, mid.y);
            } else {
                ctx.moveTo(visual_snake[0].x, visual_snake[0].y);
                ctx.lineTo(visual_snake[0].x, visual_snake[0].y);
            }
        } else if (i === 0) {
            const p_curr = visual_snake[0];
            const p_next = visual_snake[1];
            const mid = { x: (p_curr.x + p_next.x)/2, y: (p_curr.y + p_next.y)/2 };
            ctx.moveTo(mid.x, mid.y);
            ctx.lineTo(p_curr.x, p_curr.y);
        } else {
            const p_curr = visual_snake[i];
            const p_next = visual_snake[i+1];
            const p_prev = visual_snake[i-1];
            const mid_next = { x: (p_curr.x + p_next.x)/2, y: (p_curr.y + p_next.y)/2 };
            const mid_prev = { x: (p_curr.x + p_prev.x)/2, y: (p_curr.y + p_prev.y)/2 };
            ctx.moveTo(mid_next.x, mid_next.y);
            ctx.quadraticCurveTo(p_curr.x, p_curr.y, mid_prev.x, mid_prev.y);
        }
        ctx.stroke();
      }

      if (len > 1) {
        const head = visual_snake[0];
        const neck = visual_snake[1];
        const angle = Math.atan2(head.y - neck.y, head.x - neck.x);
        draw_head_eyes_at(head.x, head.y, angle);
      }
      ctx.restore();
    }

    function draw_head_eyes_at(hx, hy, angle) {
      const forward = [Math.cos(angle), Math.sin(angle)];
      const perp = [-forward[1], forward[0]];

      const eye_dist_forward = HEX_SIZE * 0.25;
      const eye_dist_side = HEX_SIZE * 0.35;
      const eye_radius = Math.max(2, Math.floor(HEX_SIZE * 0.18));

      const lx = hx + forward[0]*eye_dist_forward + perp[0]*eye_dist_side;
      const ly = hy + forward[1]*eye_dist_forward + perp[1]*eye_dist_side;
      const rx = hx + forward[0]*eye_dist_forward - perp[0]*eye_dist_side;
      const ry = hy + forward[1]*eye_dist_forward - perp[1]*eye_dist_side;

      ctx.save();
      ctx.shadowBlur = 10;
      ctx.shadowColor = "#00ffff"; 
  
      ctx.beginPath();
      ctx.fillStyle = "#00ffff";
      ctx.arc(lx, ly, eye_radius, 0, 2*Math.PI);
      ctx.fill();
  
      ctx.beginPath();
      ctx.fillStyle = "#00ffff";
      ctx.arc(rx, ry, eye_radius, 0, 2*Math.PI);
      ctx.fill();
  
      ctx.restore();
    }

    // -------------------------
    // Render Loop & Overlays
    // -------------------------
    function set_overlay(text, big=false) {
      overlay_text = text;
      overlay_big = big;
    }

    function render_loop(timestamp) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      draw_board();
      draw_honey(timestamp);
      
      if (honey_hex_effect) {
        ctx.save();
        ctx.globalAlpha = honey_hex_effect.alpha;
        ctx.strokeStyle = "#ffcc00"; 
        ctx.lineWidth = 3;

        ctx.beginPath();
        for (let i = 0; i < 6; i++) {
          const angle = (Math.PI / 3) * i;
          const px = honey_hex_effect.cx + Math.cos(angle) * (HEX_SIZE * honey_hex_effect.scale);
          const py = honey_hex_effect.cy + Math.sin(angle) * (HEX_SIZE * honey_hex_effect.scale);
          if (i === 0) ctx.moveTo(px, py);
          else ctx.lineTo(px, py);
        }
        ctx.closePath();
        ctx.stroke();
        ctx.restore();

        honey_hex_effect.scale += 0.15; 
        honey_hex_effect.alpha -= 0.03; 

        if (honey_hex_effect.alpha <= 0) {
          honey_hex_effect = null;
        }
      }
      
      while (visual_snake.length < snake.length) {
        const last = visual_snake[visual_snake.length - 1];
        visual_snake.push({ x: last.x, y: last.y });
      }

      const now = performance.now();
      if (last_step_time === 0) last_step_time = now;
      let progress = (now - last_step_time) / STEP_MS;
      if (progress > 1.0) progress = 1.0;

      if (in_fatal_grace && progress >= 0.4 && running) {
          in_fatal_grace = false;
          running = false;
          game_over = true;
          crashing = true;
          crash_effect_triggered = false;
          if (interval_id !== null) {
              clearInterval(interval_id);
              interval_id = null;
          }
      }

      if (crashing && progress >= 1.0) {
          if (!crash_effect_triggered) {
              crash_effect_triggered = true;
              crash_time = now;
              for(let i=0; i<40; i++){
                  const angle = Math.random() * Math.PI * 2;
                  const speed = 1 + Math.random() * 8;
                  crash_particles.push({
                      x: visual_snake[0].x,
                      y: visual_snake[0].y,
                      vx: Math.cos(angle) * speed,
                      vy: Math.sin(angle) * speed,
                      size: 2 + Math.random() * 5,
                      alpha: 1,
                      color: Math.random() > 0.5 ? "#ff0055" : "#ffcc00"
                  });
              }
          } else if (now - crash_time > 600) {
              if (game_over && overlay_text === null) {
                  set_overlay(`ゲームオーバー\n最終スコア: ${score}\nEnterキーでリスタート`, true);
              }
          }
      }

      const LERP_FACTOR = 0.5; 
      for (let i = 0; i < snake.length; i++) {
        const prev_cell = prev_snake[i] || snake[i];
        
        const [px, py] = axial_to_pixel(prev_cell[0], prev_cell[1]); 
        const [cx, cy] = axial_to_pixel(snake[i][0], snake[i][1]); 

        const target_x = px + (cx - px) * progress;
        const target_y = py + (cy - py) * progress;

        visual_snake[i].x += (target_x - visual_snake[i].x) * LERP_FACTOR;
        visual_snake[i].y += (target_y - visual_snake[i].y) * LERP_FACTOR;
      }

      draw_snake();

      if (crash_particles.length > 0) {
        ctx.save();
        crash_particles = crash_particles.filter(p => {
            p.alpha -= 0.03;
            if (p.alpha <= 0) return false;
            p.x += p.vx;
            p.y += p.vy;
            p.vx *= 0.92;
            p.vy *= 0.92;
            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            ctx.fillStyle = p.color;
            ctx.globalAlpha = Math.max(0, p.alpha);
            ctx.fill();
            return true;
        });
        ctx.restore();
      }

      if (overlay_text) {
        ctx.save();
        ctx.fillStyle = "rgba(10, 10, 15, 0.75)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const lines = overlay_text.split("\n");
  
        if (lines[0]) {
            ctx.font = overlay_big ? "bold 32px sans-serif" : "bold 28px sans-serif";
            ctx.shadowBlur = 15;
            ctx.shadowColor = "#ffd86b";
            ctx.fillStyle = "#ffd86b"; 
            ctx.fillText(lines[0], CENTER_X, CENTER_Y - 20);
        }
        ctx.shadowBlur = 0;
        if (lines[1] && lines.length > 2) {
            ctx.font = "16px sans-serif";
            ctx.fillStyle = "#cccccc";
            ctx.fillText(lines[1], CENTER_X, CENTER_Y + 15);
        }
        const actionText = lines[lines.length - 1];
        if (actionText) {
            const btnY = CENTER_Y + 60;
            ctx.font = "bold 14px sans-serif";
            const textWidth = ctx.measureText(actionText).width;
            const padX = 20;
            const padY = 10;
            ctx.strokeStyle = "rgba(0, 255, 135, 0.6)"; 
            ctx.lineWidth = 2;
            ctx.strokeRect(CENTER_X - textWidth / 2 - padX, btnY - padY, textWidth + padX * 2, padY * 2);
            ctx.fillStyle = "rgba(0, 255, 135, 0.1)";
            ctx.fillRect(CENTER_X - textWidth / 2 - padX, btnY - padY, textWidth + padX * 2, padY * 2);
            ctx.fillStyle = "#00ff87";
            ctx.fillText(actionText, CENTER_X, btnY);
        }
        ctx.restore();
      }

      requestAnimationFrame(render_loop);
    }

    // -------------------------
    // Game logic 
    // -------------------------
    function opposite(d1, d2) {
      return d1[0] === -d2[0] && d1[1] === -d2[1];
    }

    function step() {
      if (!running && !crashing) return;

      const [hq, hr] = snake[0];
      const [dq, dr] = current_dir;
      const new_head = [hq + dq, hr + dr];
      
      const is_fatal = !in_board(new_head) || inSnake(new_head);

      if (is_fatal) {
          in_fatal_grace = true;
          pre_fatal_snake = snake.map(c => [...c]);
          
          prev_snake = snake.map(c => [...c]);
          snake.unshift(new_head);
          
          last_step_time = performance.now();
          STEP_MS = 300; 
          
          if (interval_id !== null) {
              clearInterval(interval_id);
              interval_id = null;
          }
          return; 
      }
      
      prev_snake = snake.map(cell => [...cell]);
      snake.unshift(new_head);
      
      last_step_time = performance.now();
      STEP_MS = STEP_MS_DEFAULT; 

      if (honey !== null && eq(new_head, honey)) {
        score_increment();
        spawn_one_random_honey_not_on_snake();
      } else {
        snake.pop();
      }
    }

    function score_increment() {
      score += 1;
      score_span.innerText = score.toString();
    }

    function reset_interval() {
      if (interval_id !== null) {
        clearInterval(interval_id);
      }
      if (!in_fatal_grace && running) {
          interval_id = setInterval(step, STEP_MS);
      }
    }

    // -------------------------
    // Controls / events
    // -------------------------
    function start_game() {
      if (game_over || crashing) {
        restart_game();
        return; 
      }
      if (running) return;
      running = true;
      set_overlay(null);
      
      last_step_time = performance.now(); 
      if (interval_id === null && !in_fatal_grace) {
        interval_id = setInterval(step, STEP_MS);
      }
    }

    function stop_game(isGameOver=false) {
      if (!running && !isGameOver) return;
      running = false;
      if (interval_id !== null) {
        clearInterval(interval_id);
        interval_id = null;
      }
      if (!isGameOver) {
        set_overlay("一時停止\nEnterキーで再開");
      }
    }

    function restart_game() {
      score = 0;
      score_span.innerText = score.toString();
      game_over = false;
      running = false;
      crashing = false;
      crash_effect_triggered = false;
      crash_particles = [];
      in_fatal_grace = false;
      pre_fatal_snake = [];
      STEP_MS = STEP_MS_DEFAULT;
      
      place_initial_snake();
      spawn_one_random_honey_not_on_snake();
      
      set_overlay("Enterキーでリスタート");
      if (interval_id !== null) {
        clearInterval(interval_id);
        interval_id = null;
      }
    }

    function handle_tap_start(e) {
      if (game_over || crashing) {
        restart_game();
        start_game();
      } else if (!running) {
        start_game();
      }
    }

    function compute_dir_mapping() {
      const AXIAL_DELTAS = [[1,0],[1,-1],[0,-1],[-1,0],[-1,1],[0,1]];
      const desired_angles = {w: -90, e: -30, d: 30, s: 90, a: 150, q: -150};
      
      function angle_of_delta(delta) {
        const [x0, y0] = axial_to_pixel_raw(0, 0);
        const [x1, y1] = axial_to_pixel_raw(delta[0], delta[1]);
        const [rx0, ry0] = rotate_point(x0, y0);
        const [rx1, ry1] = rotate_point(x1, y1);
        const dx = rx1 - rx0;
        const dy = ry1 - ry0;
        return Math.atan2(dy, dx) * 180 / Math.PI;
      }
      
      const delta_angles = AXIAL_DELTAS.map(d => angle_of_delta(d));
      let DIR = {};
      let used = new Set();
      
      for (let key in desired_angles) {
        let want_ang = desired_angles[key];
        let best = null;
        let best_diff = 9999;
        for (let i = 0; i < delta_angles.length; i++) {
          if (used.has(i)) continue;
          let diff = (delta_angles[i] - want_ang + 180) % 360 - 180;
          if (Math.abs(diff) < best_diff) {
            best_diff = Math.abs(diff);
            best = i;
          }
        }
        if (best !== null) {
          used.add(best);
          DIR[key] = AXIAL_DELTAS[best];
        }
      }
      
      const remaining_keys = ["w","q","a","s","d","e"];
      for (let k of remaining_keys) {
        if (!(k in DIR)) {
          for (let i = 0; i < AXIAL_DELTAS.length; i++) {
            if (!used.has(i)) {
              used.add(i);
              DIR[k] = AXIAL_DELTAS[i];
              break;
            }
          }
        }
      }
      return DIR;
    }

    function global_key_handler(evt) {
      const key = evt.key;
      if (key === "Enter") {
        if (game_over || crashing) {
          restart_game();
          start_game();
        } else if (!running) {
          start_game();
        }
        return;
      } else if (key === "Escape") {
        if (running) {
          stop_game();
        } else if (!game_over && !crashing) {
          start_game();
        }
        return;
      }
      
      if (!running) return;
      
      const k = key.toLowerCase();
      if (!(k in DIR_MAPPING)) return;
      
      const new_dir = DIR_MAPPING[k];
      if (!opposite(new_dir, current_dir) && !eq(new_dir, current_dir)) {
        current_dir = new_dir;
        
        if (in_fatal_grace) {
            in_fatal_grace = false;
            snake = pre_fatal_snake.map(c => [...c]); 
            while (visual_snake.length > snake.length) {
                visual_snake.pop(); 
            }
        }
        step(); 
        reset_interval(); 
      }
    }

    function init() {
      DIR_MAPPING = compute_dir_mapping(); 
      resize_canvas();
      place_initial_snake(); 
      spawn_one_random_honey_not_on_snake(); 
      
      set_overlay("スタート\nEnterキーでスタート");
      
      requestAnimationFrame(render_loop);
    }

    window.addEventListener("resize", () => {
      resize_canvas();
      if(window.SwipeControllerInstance) {
        window.SwipeControllerInstance.setupCanvas();
      }
    });
    document.addEventListener("keydown", global_key_handler);
    
    canvas.addEventListener("mousedown", handle_tap_start);
    canvas.addEventListener("touchstart", handle_tap_start, { passive: true });
    
    canvas.tabIndex = 0;
    canvas.addEventListener("click", () => canvas.focus());

    init(); 
  }

  // swipe.js 
  class SwipeController {
    constructor(targetCanvas) {
      this.target = targetCanvas;
      this.canvas = document.createElement('canvas');
      this.ctx = this.canvas.getContext('2d');
      this.target.parentNode.insertBefore(this.canvas, this.target.nextSibling);
      
      this.isSwiping = false;
      this.startX = 0; this.startY = 0;
      this.currentX = 0; this.currentY = 0;
      this.lastX = 0; this.lastY = 0;
      this.particles = [];
      
      this.setupCanvas();
      this.bindEvents();
      this.animate();
      window.SwipeControllerInstance = this;
    }

    setupCanvas() {
      this.canvas.width = this.target.width;
      this.canvas.height = this.target.height;
      this.canvas.style.position = 'absolute';
      this.canvas.style.left = '0px';
      this.canvas.style.top = '0px';
      this.canvas.style.width = '100%';
      this.canvas.style.height = '100%';
      this.canvas.style.pointerEvents = 'none'; 
      this.canvas.style.background = 'transparent'; 
      this.canvas.style.zIndex = '100';
    }

    getPos(e) {
      const rect = this.canvas.getBoundingClientRect();
      const scaleX = this.canvas.width / rect.width;
      const scaleY = this.canvas.height / rect.height;
      
      if (e.touches && e.touches.length > 0) {
        return {
          x: (e.touches[0].clientX - rect.left) * scaleX,
          y: (e.touches[0].clientY - rect.top) * scaleY
        };
      }
      return {
        x: (e.clientX - rect.left) * scaleX,
        y: (e.clientY - rect.top) * scaleY
      };
    }

    bindEvents() {
      const start = (e) => {
        if (e.cancelable) e.preventDefault();
        this.isSwiping = true;
        const pos = this.getPos(e);
        this.startX = this.lastX = this.currentX = pos.x;
        this.startY = this.lastY = this.currentY = pos.y;
        this.particles = [];
        this.spawnRipple(this.startX, this.startY);
      };

      const move = (e) => {
        if (!this.isSwiping) return;
        if (e.cancelable) e.preventDefault();
        
        const pos = this.getPos(e);
        this.currentX = pos.x;
        this.currentY = pos.y;
        
        const dxParticle = this.currentX - this.lastX;
        const dyParticle = this.currentY - this.lastY;
        
        if (Math.abs(dxParticle) > 1 || Math.abs(dyParticle) > 1) {
          this.particles.push({
            x: this.currentX,
            y: this.currentY,
            vx: -dxParticle * 0.2 + (Math.random() - 0.5) * 4,
            vy: -dyParticle * 0.2 + (Math.random() - 0.5) * 4,
            life: 1.0,
            size: Math.random() * 6 + 3
          });
        }

        const dxInput = this.currentX - this.startX;
        const dyInput = this.currentY - this.startY;
        const dist = Math.sqrt(dxInput * dxInput + dyInput * dyInput);
        
        if (dist > 30) {
          this.triggerDirection(dxInput, dyInput);
          this.spawnRipple(this.currentX, this.currentY, "rgba(142, 240, 184, 0.6)");
          this.startX = this.currentX;
          this.startY = this.currentY;
        }

        this.lastX = this.currentX;
        this.lastY = this.currentY;
      };

      const end = (e) => {
        this.isSwiping = false;
      };

      this.target.addEventListener('touchstart', start, { passive: false });
      this.target.addEventListener('touchmove', move, { passive: false });
      this.target.addEventListener('touchend', end);
      
      this.target.addEventListener('mousedown', start);
      window.addEventListener('mousemove', move);
      window.addEventListener('mouseup', end);
    }

    triggerDirection(dx, dy) {
      const angleDeg = Math.atan2(dy, dx) * 180 / Math.PI;
      const targets = { 'w': -90, 'e': -30, 'd': 30, 's': 90, 'a': 150, 'q': -150 };
      
      let bestKey = null;
      let minDiff = 360;
      
      for (let key in targets) {
        let want_ang = targets[key];
        let diff = Math.abs((angleDeg - want_ang + 180) % 360 - 180);
        if (diff < minDiff) {
          minDiff = diff;
          bestKey = key;
        }
      }
      
      if (bestKey) {
        document.dispatchEvent(new KeyboardEvent('keydown', { key: bestKey }));
      }
    }

    spawnRipple(x, y, color = "rgba(255, 255, 255, 0.5)") {
      this.particles.push({
        x: x, y: y, vx: 0, vy: 0, life: 1.0, size: 5, isRipple: true, color: color
      });
    }

    animate() {
      requestAnimationFrame(() => this.animate());
      this.ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);
      
      for (let i = this.particles.length - 1; i >= 0; i--) {
        let p = this.particles[i];
        p.life -= 0.04;
        if (p.life <= 0) {
          this.particles.splice(i, 1);
          continue;
        }
        
        if (p.isRipple) {
          this.ctx.beginPath();
          this.ctx.strokeStyle = p.color;
          this.ctx.lineWidth = 4 * p.life;
          this.ctx.arc(p.x, p.y, p.size + (1 - p.life) * 40, 0, Math.PI * 2);
          this.ctx.stroke();
        } else {
          p.x += p.vx;
          p.y += p.vy;
          this.ctx.beginPath();
          this.ctx.fillStyle = `rgba(255, 255, 255, ${p.life * 0.8})`;
          this.ctx.arc(p.x, p.y, p.size * p.life, 0, Math.PI * 2);
          this.ctx.fill();
        }
      }
      
      if (this.isSwiping) {
        this.ctx.beginPath();
        this.ctx.strokeStyle = "rgba(255, 255, 255, 0.2)";
        this.ctx.lineWidth = 3;
        this.ctx.arc(this.startX, this.startY, 20, 0, Math.PI * 2);
        this.ctx.stroke();
        
        this.ctx.beginPath();
        this.ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
        this.ctx.arc(this.currentX, this.currentY, 14, 0, Math.PI * 2);
        this.ctx.fill();
        
        this.ctx.beginPath();
        this.ctx.strokeStyle = "rgba(255, 255, 255, 0.4)";
        this.ctx.lineWidth = 4;
        this.ctx.moveTo(this.startX, this.startY);
        this.ctx.lineTo(this.currentX, this.currentY);
        this.ctx.stroke();
      }
    }
  }

  window.addEventListener('DOMContentLoaded', () => {
    const canvas = document.getElementById('canvas');
    if (canvas) {
      new SwipeController(canvas);
    }
  });
